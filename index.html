 <aside class="hidden md:block md:col-span-3"><nav id="sn" class="gl border border-slate-200 rounded-2xl p-3 space-y-1 sticky top-20"></nav></aside>

<div id="md" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4"><div id="mb" class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto"></div></div>

<script type="module">
// KONFIGURASI APLIKASI
const IS_PREVIEW = true; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
  apiKey: "AIzaSyDnkKzbiD5hAeVmdpbxSx1EP9m8zu7ps84",
  authDomain: "mgmp-informatika.firebaseapp.com",
  projectId: "mgmp-informatika",
  storageBucket: "mgmp-informatika.firebasestorage.app",
  messagingSenderId: "563161501824",
  appId: "1:563161501824:web:0bc4d4b23ce04642041665"

};

const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN='w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 outline-none',BT='px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs',CD='bg-white rounded-2xl p-5 border border-slate-200 shadow-sm',GH='px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs';
const S={config:{mgmpName:'MGMP Mata Pelajaran Informatika'},admins:[],users:[],discussions:[],comments:[],materials:[],agendas:[],rsvps:[],workspaces:[]};
let me=null,F={},db,au,cur='beranda',wsId=null,wsShown=null,deferred=null;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'Baru saja':m<60?m+' menit lalu':m<1440?Math.round(m/60)+' jam lalu':Math.round(m/1440)+' hari lalu'};
const toast=m=>{const t=$('ts');t.textContent=m;t.classList.remove('opacity-0');setTimeout(()=>t.classList.add('opacity-0'),3200)};
const isSA=()=>me?.role==='Super Admin',isK=()=>me?.kind==='admin',W=()=>{if(!me||me.kind==='guest'){toast('Masuk sebagai anggota untuk memakai fitur ini.');return false}return true};
const empty=t=>`<div class="${CD} text-center text-xs text-slate-400">${t}</div>`;
const fld=(n,l,t='text',o,v='',ph='')=>`<div><label class="block text-xs font-semibold mb-1">${l}</label>${o?`<select name="${n}" class="${IN}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='ta'?`<textarea name="${n}" rows="3" class="${IN}" placeholder="${ph}">${E(v)}</textarea>`:`<input name="${n}" type="${t}" value="${E(v)}" required class="${IN}" placeholder="${ph}">`}</div>`;
function modal(title,body,fn,ok='Simpan'){$('mb').innerHTML=`<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-sm">${title}</h3><button onclick="A.close()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button></div><form id="mf" class="space-y-3">${body}${fn?`<button class="${BT} w-full">${ok}</button>`:''}</form>`;
 if(fn)$('mf').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)))}catch(x){toast(x.code?.startsWith('auth/')?'Email atau kata sandi salah.':'Gagal: '+(x.code||x.message))}};
 $('md').classList.replace('hidden','flex');lucide.createIcons()}
const close=()=>{$('md').classList.replace('flex','hidden');$('mb').innerHTML=''};

// ===== LAPISAN DATA (memori saat preview, Firestore saat produksi) =====
const col=(c,p)=>c=='comments'?F.collection(db,'discussions',p,'comments'):c=='rsvps'?F.collection(db,'agendas',p,'rsvps'):F.collection(db,c);
async function add(c,d,id){if(IS_PREVIEW){id=id||'p'+Math.random().toString(36).slice(2,9);S[c]=S[c].filter(x=>!(x.id==id&&x.parentId==d.parentId));S[c].push({id,...d});fill();return id}
 if(id){await F.setDoc(F.doc(col(c,d.parentId),id),d);return id}return (await F.addDoc(col(c,d.parentId),d)).id}
const dref=(c,id,p)=>c=='comments'?F.doc(db,'discussions',p,'comments',id):c=='rsvps'?F.doc(db,'agendas',p,'rsvps',id):F.doc(db,c,id);
async function upd(c,id,d){if(IS_PREVIEW){Object.assign(S[c].find(x=>x.id==id),d);fill();return}await F.updateDoc(dref(c,id),d)}
async function del(c,id,p){if(IS_PREVIEW){S[c]=S[c].filter(x=>!(x.id==id&&(!p||x.parentId==p)));fill();return}await F.deleteDoc(dref(c,id,p))}
async function findUser(u){if(IS_PREVIEW)return S.users.find(x=>x.username==u||x.idNumber==u);
 for(const f of['username','idNumber']){const s=await F.getDocs(F.query(F.collection(db,'users'),F.where(f,'==',u)));if(!s.empty)return{id:s.docs[0].id,...s.docs[0].data()}}}

async function seed(){const s='demo',h=await sha(s+'edudigital'),t=Date.now();
 S.admins=[{id:'a1',email:'superadmin@mgmp.id',pw:'edudigital',nama:'Super Admin Dinas/Penmad',role:'Super Admin',sekolah:'Dinas Pendidikan',idType:'NUPTK',idNumber:'1985010120100110'},{id:'a2',email:'ketua@mgmp.id',pw:'edudigital',nama:'Pengurus Ketua MGMP',role:'Pengurus Ketua MGMP (Moderator)',sekolah:'SMPN 1 City',idType:'NUPTK',idNumber:'1980020220080120'}];
 S.users=[{id:'u1',username:'peserta',passwordHash:h,salt:s,nama:'Budi Santoso, S.Pd',idType:'NUPTK',idNumber:'3456789012345678',sekolah:'SMPN 2 City',role:'Guru Anggota',status:'approved',sertifikat:2,createdAt:t},{id:'u2',username:'siti_guru',passwordHash:h,salt:s,nama:'Siti Aminah, M.Pd',idType:'PegID',idNumber:'12345678901234',sekolah:'SMPN 3 City',role:'Guru Anggota',status:'pending',sertifikat:0,createdAt:t}];
 S.discussions=[{id:'d1',authorId:'u1',authorName:'Budi Santoso, S.Pd',kategori:'Kurikulum Merdeka',judul:'Bagaimana menyusun TP dan ATP Informatika?',konten:'Apakah alur tujuan pembelajaran Berpikir Komputasional lebih fleksibel dibahas di awal semester?',likedBy:[],likesCount:0,createdAt:t-72e5}];
 S.comments=[{id:'c1',parentId:'d1',authorName:'Pengurus Ketua MGMP',text:'Kami membaginya berdasarkan alokasi JP per minggu.',createdAt:t-36e5}];
 S.materials=[{id:'m1',uploaderId:'u1',uploaderName:'Budi Santoso, S.Pd',status:'approved',judul:'Modul Ajar Algoritma dan Pemrograman Dasar',kategori:'Modul Ajar',kelas:'Kelas VII / 7',link:'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview',deskripsi:'Lengkap dengan LKPD Scratch dan rubrik asesmen.',downloads:56,createdAt:t},{id:'m2',uploaderId:'u1',uploaderName:'Budi Santoso, S.Pd',status:'pending',judul:'LKPD Praktikum Jaringan Komputer',kategori:'LKPD',kelas:'Kelas VIII / 8',link:'https://docs.google.com/document/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview',deskripsi:'Langkah konfigurasi IP address dan LAN.',downloads:0,createdAt:t}];
 S.agendas=[{id:'g1',judul:'Webinar MGMP: Modul Ajar Interaktif',tanggal:'15 November 2026 - 13.00 WIB',lokasi:'Zoom Meeting',deskripsi:'Pelatihan modul ajar digital.',createdBy:'Pengurus Ketua MGMP',createdAt:t},{id:'g2',judul:'Rapat Koordinasi & Workshop Coding',tanggal:'25 November 2026 - 09.00 WIB',lokasi:'Lab Komputer SMPN 1',deskripsi:'Penyusunan modul praktikum.',createdBy:'Pengurus Ketua MGMP',createdAt:t}];
 S.workspaces=[{id:'w1',judul:'Modul Ajar Pembelajaran Berdiferensiasi',kategori:'Modul Ajar',mode:'canvas',konten:'Tujuan pembelajaran:\n- ...',gdocsUrl:'',ownerId:'a2',ownerName:'Pengurus Ketua MGMP',collaborators:[{userId:'a2',nama:'Pengurus Ketua MGMP',role:'Pemilik (Owner)'},{userId:'u1',nama:'Budi Santoso, S.Pd',role:'Editor'}],updatedAt:t}]}

async function boot(){
 if(IS_PREVIEW){$('pvBanner').innerHTML='<span class="px-3 py-1 bg-amber-100 text-amber-800 text-[11px] font-bold rounded-full">Mode Preview: data sementara, tidak terhubung ke Firebase</span>';await seed()}
 else{const B='https://www.gstatic.com/firebasejs/10.12.2/';const[a,b,c]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  F={...a,...b,...c};const app=F.initializeApp(firebaseConfig);db=F.getFirestore(app);au=F.getAuth(app);
  ['admins','users','discussions','materials','agendas','workspaces'].forEach(c=>F.onSnapshot(F.collection(db,c),s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));fill()},()=>{}));
  ['comments','rsvps'].forEach(c=>F.onSnapshot(F.collectionGroup(db,c),s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));fill()},()=>{}));
  F.onSnapshot(F.doc(db,'app_config','main'),s=>{if(s.exists())S.config=s.data();fill()},()=>{});
  F.onAuthStateChanged(au,async u=>{if(u&&!me){const s=await F.getDoc(F.doc(db,'admins',u.uid));if(s.exists())enter({id:s.id,...s.data(),kind:'admin'})}})}
 document.querySelectorAll('.nm').forEach(e=>e.textContent=S.config.mgmpName);lucide.createIcons();pwa()}

function pwa(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;fill()});
 try{const b=new Blob(["self.addEventListener('fetch',()=>{});"],{type:'text/javascript'});navigator.serviceWorker?.register(URL.createObjectURL(b)).catch(()=>{})}catch(e){}}

// ===== AUTENTIKASI =====
async function login(d){const u=d.u.trim(),p=d.p;
 if(u.includes('@')){let a;if(IS_PREVIEW){a=S.admins.find(x=>x.email==u&&x.pw==p);if(!a)return toast('Email atau kata sandi salah.')}
  else{const c=await F.signInWithEmailAndPassword(au,u,p),s=await F.getDoc(F.doc(db,'admins',c.user.uid));if(!s.exists()){await F.signOut(au);return toast('Akun ini belum terdaftar sebagai admin MGMP.')}a={id:s.id,...s.data()}}
  return enter({...a,kind:'admin'})}
 const x=await findUser(u);if(!x||await sha(x.salt+p)!==x.passwordHash)return toast('Akun atau kata sandi salah.');
 if(x.status!='approved')return toast('Akun masih menunggu persetujuan Super Admin.');enter({...x,kind:'user'})}
async function register(d){const n=d.idNumber.trim();
 if(!/^\d+$/.test(n)||(d.idType=='NUPTK'&&n.length!=16)||(d.idType=='PegID'&&n.length!=14))return toast(d.idType=='NUPTK'?'NUPTK harus 16 digit angka.':'PegID harus 14 digit angka.');
 if(await findUser(d.username.trim())||await findUser(n))return toast('Username atau nomor identitas sudah terdaftar.');
 const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
 await add('users',{username:d.username.trim(),passwordHash:await sha(salt+d.password),salt,nama:d.nama,idType:d.idType,idNumber:n,sekolah:d.sekolah,role:'Guru Anggota',status:'pending',sertifikat:0,createdAt:Date.now()});
 close();toast('Pendaftaran berhasil. Menunggu persetujuan Super Admin.')}
function enter(u){me=u;close();$('land').classList.add('hidden');$('hd').classList.remove('hidden');$('app').classList.remove('hidden');$('bn').classList.replace('hidden','flex');
 const v=vis();$('sn').innerHTML=v.map(t=>`<button id="s-${t[0]}" onclick="A.go('${t[0]}')" class="sb w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600"><i data-lucide="${t[2]}" class="w-5 h-5"></i>${t[1]}</button>`).join('');
 const m=['beranda','konten','agenda','profil'];$('bn').innerHTML=v.filter(t=>m.includes(t[0])).map(t=>`<button id="b-${t[0]}" onclick="A.go('${t[0]}')" class="bb flex flex-col items-center text-[10px] font-semibold text-slate-500"><i data-lucide="${t[2]}" class="w-5 h-5"></i>${t[1].split(' ')[0]}</button>`).join('')+(v.length>4?`<button onclick="A.more()" class="flex flex-col items-center text-[10px] font-semibold text-slate-500"><i data-lucide="layout-grid" class="w-5 h-5"></i>Lainnya</button>`:'');
 $('hn').textContent=me.nama;$('hr').textContent=me.role;go('beranda');toast('Selamat datang, '+me.nama)}
const T=[['beranda','Forum Diskusi','message-square'],['konten','Perangkat Ajar','folder-git-2'],['agenda','Agenda & RSVP','calendar'],['workspace','Ruang Kolaborasi','file-edit'],['moderasi','Moderasi Kurasi','shield-check','k'],['superadmin','Pengaturan Super Admin','settings','s'],['analitik','Analitik Wilayah','bar-chart-3','k'],['profil','Portofolio Digital','award']];
const vis=()=>T.filter(t=>me.kind=='guest'?!['workspace','moderasi','superadmin','analitik'].includes(t[0]):!t[3]||(t[3]=='s'?isSA():isK()));
async function logout(){if(!IS_PREVIEW&&me.kind=='admin')await F.signOut(au);me=null;wsId=wsShown=null;['hd','app'].forEach(i=>$(i).classList.add('hidden'));$('bn').classList.replace('flex','hidden');$('land').classList.remove('hidden');toast('Anda telah keluar.')}

// ===== TAB =====
const TB={
beranda:{shell:()=>`${me.kind!='guest'?`<div class="${CD} space-y-2"><input name="j" id="pj" placeholder="Judul topik atau pertanyaan..." class="${IN} font-semibold"><textarea id="pk" rows="2" placeholder="Bagikan pengalaman atau ajukan pertanyaan..." class="${IN}"></textarea><div class="flex justify-between gap-2"><select id="pc" class="${IN} w-auto">${['Diskusi Umum','Metode Pengajaran','Kurikulum Merdeka','Kendala Kelas'].map(x=>`<option>${x}</option>`).join('')}</select><button onclick="A.post()" class="${BT}">Publikasikan</button></div></div>`:''}<input id="q" oninput="fill()" placeholder="Cari topik..." class="${IN}"><div id="l" class="space-y-4"></div>`,
 fill:()=>{const q=($('q').value||'').toLowerCase();$('l').innerHTML=S.discussions.filter(d=>(d.judul+d.konten).toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt).map(d=>{const cs=S.comments.filter(c=>c.parentId==d.id).sort((a,b)=>a.createdAt-b.createdAt),lk=(d.likedBy||[]).includes(me.id);
  return`<div class="${CD} space-y-3"><div class="flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-teal-100 text-teal-700 font-bold flex items-center justify-center text-xs">${E(d.authorName[0])}</div><div><p class="text-xs font-bold">${E(d.authorName)}</p><p class="text-[10px] text-slate-400">${ago(d.createdAt)}</p></div></div><span class="px-2.5 py-1 rounded-full bg-slate-100 text-[10px] font-semibold">${E(d.kategori)}</span></div><h4 class="font-bold text-sm">${E(d.judul)}</h4><p class="text-xs text-slate-600">${E(d.konten)}</p>
  <div class="flex gap-4 pt-3 border-t text-xs font-semibold"><button onclick="A.like('${d.id}')" class="flex items-center gap-1.5 ${lk?'text-rose-600':'text-slate-500'}"><i data-lucide="heart" class="w-4 h-4 ${lk?'fill-rose-600':''}"></i>${d.likesCount||0} Suka</button><span class="text-slate-500">${cs.length} Komentar</span>${isK()?`<button onclick="A.delDisc('${d.id}')" class="text-rose-500 ml-auto">Hapus</button>`:''}</div>
  ${cs.map(c=>`<div class="bg-slate-50 p-2.5 rounded-xl text-xs"><b>${E(c.authorName)}:</b> ${E(c.text)}</div>`).join('')}
  ${me.kind!='guest'?`<div class="flex gap-2"><input id="ci-${d.id}" placeholder="Tulis komentar..." class="${IN}"><button onclick="A.comment('${d.id}')" class="${BT}">Kirim</button></div>`:''}</div>`}).join('')||empty('Belum ada diskusi. Mulai topik pertama.')}},
konten:{shell:()=>`<div class="bg-gradient-to-r from-teal-700 to-emerald-600 text-white p-5 rounded-2xl flex justify-between items-center gap-3"><div><h2 class="font-bold">Perangkat Ajar</h2><p class="text-xs text-teal-100">Modul, LKPD, bahan ajar, dan soal yang sudah dikurasi.</p></div>${me.kind!='guest'?`<button onclick="A.upload()" class="px-4 py-2 bg-white text-teal-800 rounded-xl text-xs font-bold shrink-0">Unggah berkas</button>`:''}</div>
 <div class="grid grid-cols-1 sm:grid-cols-3 gap-2"><select id="fk" onchange="fill()" class="${IN}">${['Semua','Modul Ajar','LKPD','Bahan Ajar / PPT','Bank Soal'].map(x=>`<option>${x}</option>`).join('')}</select><select id="fc" onchange="fill()" class="${IN}">${['Semua','Kelas VII / 7','Kelas VIII / 8','Kelas IX / 9'].map(x=>`<option>${x}</option>`).join('')}</select><input id="q" oninput="fill()" placeholder="Cari bahan ajar..." class="${IN}"></div><div id="l" class="grid sm:grid-cols-2 gap-4"></div>`,
 fill:()=>{const k=$('fk').value,c=$('fc').value,q=$('q').value.toLowerCase();$('l').innerHTML=S.materials.filter(m=>m.status=='approved'&&(k=='Semua'||m.kategori==k)&&(c=='Semua'||m.kelas==c)&&(m.judul+m.deskripsi).toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt).map(m=>`<div class="${CD} space-y-2 flex flex-col justify-between"><div class="space-y-2"><div class="flex justify-between"><span class="px-2 py-0.5 bg-teal-50 text-teal-700 text-[10px] font-bold rounded-md border border-teal-200">${E(m.kategori)}</span><span class="text-[10px] text-slate-400 font-semibold">${E(m.kelas)}</span></div><h4 class="font-bold text-sm">${E(m.judul)}</h4><p class="text-xs text-slate-500">${E(m.deskripsi)}</p><p class="text-[10px] text-slate-400">Kontributor: ${E(m.uploaderName)}</p></div><div class="pt-3 border-t flex justify-between items-center"><span class="text-[11px] font-bold bg-slate-100 px-2.5 py-1 rounded-lg">${m.downloads||0} Unduhan</span><div class="flex gap-1.5"><button onclick="A.prev('${m.id}')" class="${GH}">Pratinjau</button><button onclick="A.dl('${m.id}')" class="${BT} !py-1.5">Unduh</button></div></div></div>`).join('')||empty('Belum ada perangkat ajar terkurasi.')}},
agenda:{shell:()=>`<div class="flex justify-between items-center"><h3 class="font-bold">Agenda kegiatan MGMP</h3>${isK()?`<button onclick="A.newAgenda()" class="${BT}">Tambah agenda</button>`:''}</div><div id="l" class="space-y-4"></div>`,
 fill:()=>{$('l').innerHTML=S.agendas.slice().sort((a,b)=>b.createdAt-a.createdAt).map(a=>{const r=S.rsvps.filter(x=>x.parentId==a.id),mine=r.find(x=>x.id==me.id),n=t=>r.filter(x=>x.tipe==t).length,bt=(t,c)=>`<button onclick="A.rsvp('${a.id}','${t}')" class="px-4 py-2 text-xs font-bold rounded-xl border ${mine?.tipe==t?c+' text-white':'bg-white text-slate-700'}">Hadir ${t=='luring'?'Luring':'Daring'}</button>`;
  return`<div class="${CD} space-y-3"><div class="flex flex-col sm:flex-row justify-between gap-2"><div><h4 class="font-bold">${E(a.judul)}</h4><p class="text-xs text-teal-600 font-bold">${E(a.tanggal)}</p></div><span class="px-3 py-1.5 bg-slate-100 text-xs font-semibold rounded-xl self-start">${E(a.lokasi)}</span></div><p class="text-xs text-slate-600">${E(a.deskripsi)}</p>
  <div class="bg-slate-50 p-3 rounded-2xl flex flex-col sm:flex-row justify-between gap-3 items-center"><p class="text-xs font-bold">RSVP: <span class="text-emerald-600">${n('luring')} Luring</span> | <span class="text-indigo-600">${n('daring')} Daring</span></p><div class="flex gap-2">${bt('luring','bg-emerald-600 border-emerald-600')}${bt('daring','bg-indigo-600 border-indigo-600')}<button onclick="A.remind('${a.id}')" title="Pengingat" class="p-2 rounded-xl border bg-amber-50 text-amber-700 border-amber-200"><i data-lucide="bell" class="w-4 h-4"></i></button>${isK()?`<button onclick="A.delAgenda('${a.id}')" class="${GH} !text-rose-600">Hapus</button>`:''}</div></div></div>`}).join('')||empty('Belum ada agenda kegiatan.')}},
workspace:{shell:()=>`<div class="${CD} space-y-3"><div class="flex flex-wrap gap-2 justify-between"><select id="ws" onchange="A.pick(this.value)" class="${IN} w-auto"></select><div class="flex gap-2"><button onclick="A.newWs()" class="${GH}">Dokumen baru</button><button onclick="A.invite()" class="${GH} !text-indigo-700">Undang anggota</button><button onclick="A.saveWs()" class="${BT}">Simpan dokumen</button></div></div>
 <div id="wb" class="space-y-3"><div class="grid sm:grid-cols-3 gap-2"><input id="wt" class="${IN} font-bold" placeholder="Judul dokumen"><select id="wk" class="${IN}"><option>Modul Ajar</option><option>LKPD Siswa</option></select><select id="wm" onchange="A.mode()" class="${IN}"><option value="canvas">Mode: Canvas Teks</option><option value="gdocs">Mode: Google Docs Embed</option></select></div>
 <div class="bg-slate-50 p-3 rounded-xl text-xs space-y-2"><b>Tim kolaborator (<span id="wc">0</span>)</b><div id="wl" class="flex flex-wrap gap-2"></div></div>
 <textarea id="wx" rows="12" class="${IN} font-mono" placeholder="Tulis dokumen di sini..."></textarea>
 <div id="wg" class="hidden space-y-2"><div class="flex gap-2"><input id="wu" type="url" class="${IN}" placeholder="https://docs.google.com/document/d/.../edit"><button onclick="A.gdoc()" class="${BT} shrink-0">Muat</button></div><iframe id="wf" class="w-full h-[480px] rounded-xl border"></iframe></div></div><p id="we" class="hidden text-center text-xs text-slate-400">Belum ada dokumen. Buat dokumen baru atau minta diundang.</p></div>`,
 fill:()=>{const l=wsList();if(!l.find(w=>w.id==wsId))wsId=l[0]?.id||null;$('ws').innerHTML=l.map(w=>`<option value="${w.id}" ${w.id==wsId?'selected':''}>${E(w.judul)}</option>`).join('');$('wb').classList.toggle('hidden',!wsId);$('we').classList.toggle('hidden',!!wsId);const w=l.find(x=>x.id==wsId);if(!w)return;
  $('wc').textContent=w.collaborators.length;$('wl').innerHTML=w.collaborators.map(c=>`<span class="px-2.5 py-1 bg-white border rounded-xl text-[11px]"><b>${E(c.nama)}</b> <i class="text-indigo-600">${E(c.role)}</i></span>`).join('');
  const ed=canEdit(w);['wt','wk','wm','wx','wu'].forEach(i=>$(i).disabled=!ed);
  if(wsShown!=w.id){wsShown=w.id;$('wt').value=w.judul;$('wk').value=w.kategori;$('wm').value=w.mode;$('wx').value=w.konten;$('wu').value=w.gdocsUrl||'';A.mode();if(w.gdocsUrl)A.gdoc(1)}}},
moderasi:{shell:()=>`<h3 class="font-bold">Antrean kurasi perangkat ajar</h3><div id="l" class="space-y-3"></div>`,
 fill:()=>{$('l').innerHTML=S.materials.filter(m=>m.status=='pending').map(m=>`<div class="${CD} border-amber-200 flex justify-between items-center gap-2"><div><p class="font-bold text-xs">${E(m.judul)}</p><p class="text-[10px] text-slate-500">${E(m.uploaderName)} · ${E(m.kategori)} · ${E(m.kelas)}</p><a href="${E(m.link)}" target="_blank" rel="noopener" class="text-[10px] text-teal-600 font-bold">Buka tautan</a></div><div class="flex gap-1.5"><button onclick="A.modMat('${m.id}',1)" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold">Setujui</button><button onclick="A.modMat('${m.id}',0)" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded-lg text-xs font-bold">Tolak</button></div></div>`).join('')||empty('Tidak ada antrean kurasi.')}},
superadmin:{shell:()=>`<div class="bg-purple-900 text-white p-5 rounded-2xl"><h3 class="font-bold">Pengaturan Super Admin</h3><p class="text-xs text-purple-200">Nama MGMP, persetujuan akun, dan data anggota.</p></div><div class="${CD} space-y-2"><b class="text-xs">Nama MGMP</b><div class="flex gap-2"><input id="cn" class="${IN}"><button onclick="A.saveName()" class="${BT} !bg-purple-700">Simpan</button></div></div><div class="${CD} space-y-2 overflow-x-auto"><b class="text-xs">Anggota guru (<span id="uc">0</span>)</b><table class="w-full text-xs"><thead class="text-left text-slate-500"><tr><th class="p-2">Guru</th><th class="p-2">Identitas</th><th class="p-2">Sertifikat</th><th class="p-2">Status</th><th class="p-2 text-right">Aksi</th></tr></thead><tbody id="ub"></tbody></table></div><div class="${CD} text-xs space-y-1"><b>Admin &amp; Pengurus (dikelola di Firebase Authentication)</b><div id="ab"></div></div>`,
 fill:()=>{if(document.activeElement?.id!='cn')$('cn').value=S.config.mgmpName;$('uc').textContent=S.users.length;$('ub').innerHTML=S.users.map(u=>`<tr class="border-t ${u.status=='pending'?'bg-amber-50/50':''}"><td class="p-2"><b>${E(u.nama)}</b><br><span class="text-[10px] text-slate-400">${E(u.sekolah)}</span></td><td class="p-2 font-mono">${E(u.idType)}: ${E(u.idNumber)}</td><td class="p-2"><input type="number" min="0" value="${u.sertifikat||0}" onchange="A.cert('${u.id}',this.value)" class="w-14 px-2 py-1 border rounded"></td><td class="p-2">${u.status=='approved'?'<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-[10px]">Terverifikasi</span>':'<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-bold text-[10px]">Menunggu</span>'}</td><td class="p-2 text-right">${u.status=='pending'?`<button onclick="A.appr('${u.id}')" class="px-2.5 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold">Setujui</button> `:''}<button onclick="A.rej('${u.id}')" class="px-2.5 py-1 bg-rose-100 text-rose-700 rounded text-[10px] font-bold">${u.status=='pending'?'Tolak':'Hapus'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada anggota terdaftar.</td></tr>';
  $('ab').innerHTML=S.admins.map(a=>`<p>${E(a.nama)} · <i class="text-purple-700">${E(a.role)}</i> · ${E(a.email)}</p>`).join('')||'<p class="text-slate-400">Belum ada data admin.</p>'}},
analitik:{shell:()=>`<div class="bg-slate-900 text-white p-5 rounded-2xl"><h3 class="font-bold">Dashboard Analitik Wilayah</h3><p class="text-xs text-slate-300">Dihitung langsung dari data MGMP.</p></div><div id="l" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>`,
 fill:()=>{const a=S.materials.filter(m=>m.status=='approved');$('l').innerHTML=[['Guru terverifikasi',S.users.filter(u=>u.status=='approved').length,'teal'],['Modul terkurasi',a.length,'emerald'],['Diskusi',S.discussions.length,'indigo'],['Total unduhan',a.reduce((s,m)=>s+(m.downloads||0),0),'amber']].map(x=>`<div class="${CD} text-center"><p class="text-[11px] text-slate-500 font-semibold">${x[0]}</p><p class="text-2xl font-extrabold text-${x[2]}-600 mt-1">${x[1].toLocaleString('id-ID')}</p></div>`).join('')}},
profil:{shell:()=>`<div class="${CD} max-w-2xl mx-auto space-y-5"><div class="flex items-center gap-4"><div class="w-16 h-16 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold text-2xl">${E(me.nama[0])}</div><div><h3 class="text-lg font-bold">${E(me.nama)}</h3><p class="text-xs text-teal-600 font-semibold">${E(me.role)}</p><p class="text-xs font-mono text-slate-600">${me.kind=='guest'?'Akses terbatas':E(me.idType+': '+me.idNumber)}</p><p class="text-xs text-slate-500">${E(me.sekolah||'')}</p></div></div><div id="l" class="grid grid-cols-3 gap-3 text-center"></div><div id="ins"></div><button onclick="A.out()" class="w-full py-2.5 bg-rose-50 text-rose-600 font-bold rounded-xl text-xs border border-rose-200">Keluar dari akun</button></div>`,
 fill:()=>{const mm=S.materials.filter(m=>m.uploaderId==me.id&&m.status=='approved'),u=S.users.find(x=>x.id==me.id);$('l').innerHTML=[['Modul divalidasi',mm.length+' berkas'],['Total unduhan',mm.reduce((s,m)=>s+(m.downloads||0),0)+' kali'],['Sertifikat MGMP',(u?.sertifikat||0)+' sertifikat']].map(x=>`<div class="bg-slate-50 p-3 rounded-xl border"><p class="text-[11px] text-slate-500">${x[0]}</p><p class="font-bold">${x[1]}</p></div>`).join('');$('ins').innerHTML=deferred?`<button onclick="A.install()" class="${BT} w-full">Pasang aplikasi di perangkat</button>`:''}}};
const wsList=()=>S.workspaces.filter(w=>me&&(isK()||w.collaborators.some(c=>c.userId==me.id)));
const canEdit=w=>isK()||w.collaborators.some(c=>c.userId==me.id&&c.role!='Viewer');
function go(t){cur=t;$('tab').innerHTML=TB[t].shell();document.querySelectorAll('.sb,.bb').forEach(b=>b.classList.remove('bg-teal-50','text-teal-700','!text-teal-600'));$('s-'+t)?.classList.add('bg-teal-50','text-teal-700');$('b-'+t)?.classList.add('!text-teal-600');close();fill()}
function fill(){document.querySelectorAll('.nm').forEach(e=>e.textContent=S.config.mgmpName);if(!me||!TB[cur])return;TB[cur].fill();lucide.createIcons()}

// ===== AKSI =====
const run=f=>async(...a)=>{try{await f(...a)}catch(x){toast(x.code?.startsWith('auth/')?'Email atau kata sandi salah.':'Gagal: '+(x.code||x.message))}};
const A={close,go,
 auth:m=>m=='login'?modal('Masuk Ruang MGMP',fld('u','Username / NUPTK / PegID / Email Admin','text',0,'','Email untuk admin')+fld('p','Kata sandi','password')+`<p class="text-center text-xs"><button type="button" onclick="A.auth('reg')" class="text-teal-600 font-bold">Belum punya akun? Daftar</button></p>`+(IS_PREVIEW?`<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[11px]">Akun demo (sandi: edudigital): <b>superadmin@mgmp.id</b>, <b>ketua@mgmp.id</b>, <b>peserta</b></div>`:''),login,'Masuk'):
  modal('Pendaftaran Guru MGMP',fld('idType','Jenis identitas','text',['NUPTK','PegID'])+fld('idNumber','Nomor NUPTK (16 digit) / PegID (14 digit)')+fld('nama','Nama lengkap & gelar')+fld('sekolah','Asal sekolah')+fld('username','Username')+fld('password','Kata sandi','password')+`<p class="text-center text-xs"><button type="button" onclick="A.auth('login')" class="text-slate-500 font-bold">Sudah punya akun? Masuk</button></p>`,register,'Daftar'),
 guest:()=>enter({id:'guest',kind:'guest',nama:'Pengunjung',role:'Tamu (Guest)',sekolah:'Non-Member'}),
 more:()=>modal('Menu lainnya',vis().filter(t=>!['beranda','konten','agenda','profil'].includes(t[0])).map(t=>`<button type="button" onclick="A.go('${t[0]}')" class="${GH} w-full text-left">${t[1]}</button>`).join('')),
 post:run(async()=>{if(!W())return;const j=$('pj').value.trim(),k=$('pk').value.trim();if(!j||!k)return toast('Judul dan isi diskusi wajib diisi.');await add('discussions',{authorId:me.id,authorName:me.nama,kategori:$('pc').value,judul:j,konten:k,likedBy:[],likesCount:0,createdAt:Date.now()});$('pj').value=$('pk').value='';toast('Diskusi dipublikasikan.')}),
 like:run(async id=>{if(!W())return;const d=S.discussions.find(x=>x.id==id),l=d.likedBy||[],y=l.includes(me.id),n=y?l.filter(x=>x!=me.id):[...l,me.id];await upd('discussions',id,{likedBy:n,likesCount:n.length})}),
 comment:run(async id=>{if(!W())return;const i=$('ci-'+id),t=i.value.trim();if(!t)return;await add('comments',{parentId:id,authorName:me.nama,text:t,createdAt:Date.now()});toast('Komentar ditambahkan.')}),
 delDisc:run(async id=>{await del('discussions',id);toast('Diskusi dihapus.')}),
 upload:()=>W()&&modal('Unggah perangkat ajar',fld('judul','Judul dokumen')+fld('kategori','Jenis dokumen','text',['Modul Ajar','LKPD','Bahan Ajar / PPT','Bank Soal'])+fld('kelas','Sasaran kelas','text',['Kelas VII / 7','Kelas VIII / 8','Kelas IX / 9'])+fld('link','Tautan Google Drive','url')+fld('deskripsi','Deskripsi singkat','ta'),run(async d=>{if(!/^https?:\/\//.test(d.link))return toast('Tautan harus diawali http:// atau https://');await add('materials',{...d,uploaderId:me.id,uploaderName:me.nama,status:'pending',downloads:0,createdAt:Date.now()});close();toast('Berkas dikirim ke antrean kurasi.')})),
 prev:id=>{const m=S.materials.find(x=>x.id==id);let u=m.link;if(/docs|drive\.google/.test(u))u=u.includes('/view')?u.replace('/view','/preview'):u.includes('/preview')?u:u.replace(/\/edit.*$/,'/preview');modal(E(m.judul),`<iframe src="${E(u)}" class="w-full h-[55vh] rounded-xl border"></iframe><a href="${E(m.link)}" target="_blank" rel="noopener" onclick="A.count('${id}')" class="${BT} block text-center">Unduh berkas</a>`)},
 count:run(async id=>{const m=S.materials.find(x=>x.id==id);if(me.kind!='guest')await upd('materials',id,{downloads:(m.downloads||0)+1})}),
 dl:run(async id=>{const m=S.materials.find(x=>x.id==id);await A.count(id);window.open(m.link,'_blank','noopener')}),
 modMat:run(async(id,ok)=>{ok?await upd('materials',id,{status:'approved'}):await del('materials',id);toast(ok?'Modul divalidasi.':'Pengajuan ditolak.')}),
 newAgenda:()=>modal('Agenda baru',fld('judul','Nama kegiatan')+fld('tanggal','Waktu & tanggal','text',0,'','15 November 2026 - 13.00 WIB')+fld('lokasi','Lokasi / tautan Zoom atau Meet')+fld('deskripsi','Deskripsi','ta'),run(async d=>{await add('agendas',{...d,createdBy:me.nama,createdAt:Date.now()});close();toast('Agenda diterbitkan.')})),
 delAgenda:run(async id=>{await del('agendas',id);toast('Agenda dihapus.')}),
 rsvp:run(async(id,t)=>{if(!W())return;const r=S.rsvps.find(x=>x.parentId==id&&x.id==me.id);if(r?.tipe==t){await del('rsvps',me.id,id);return toast('Konfirmasi dibatalkan.')}await add('rsvps',{parentId:id,nama:me.nama,tipe:t},me.id);toast('Kehadiran '+t+' tersimpan.')}),
 remind:run(async id=>{const a=S.agendas.find(x=>x.id==id);window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.judul)+'&details='+encodeURIComponent(a.tanggal+'\n'+a.deskripsi)+'&location='+encodeURIComponent(a.lokasi),'_blank','noopener');if('Notification' in window&&await Notification.requestPermission()=='granted')new Notification('Pengingat aktif',{body:a.judul+' - '+a.tanggal});toast('Tambahkan ke Google Calendar untuk pengingat otomatis.')}),
 pick:v=>{wsId=v;wsShown=null;fill()},
 mode:()=>{const g=$('wm').value=='gdocs';$('wx').classList.toggle('hidden',g);$('wg').classList.toggle('hidden',!g)},
 gdoc:run(async q=>{let u=$('wu').value.trim();if(!/^https:\/\/docs\.google\.com\//.test(u))return q||toast('Gunakan tautan Google Docs (docs.google.com).');$('wf').src=u.replace(/\/edit.*$/,'/edit?embedded=true')}),
 newWs:run(async()=>{if(!W())return;wsId=await add('workspaces',{judul:'Dokumen baru',kategori:'Modul Ajar',mode:'canvas',konten:'',gdocsUrl:'',ownerId:me.id,ownerName:me.nama,collaborators:[{userId:me.id,nama:me.nama,role:'Pemilik (Owner)'}],updatedAt:Date.now()});wsShown=null;fill()}),
 saveWs:run(async()=>{const w=S.workspaces.find(x=>x.id==wsId);if(!w||!canEdit(w))return toast('Anda hanya dapat melihat dokumen ini.');await upd('workspaces',wsId,{judul:$('wt').value||'Tanpa judul',kategori:$('wk').value,mode:$('wm').value,konten:$('wx').value,gdocsUrl:$('wu').value,updatedAt:Date.now()});toast('Dokumen disimpan ke database MGMP.')}),
 invite:()=>{const w=S.workspaces.find(x=>x.id==wsId);if(!w||!canEdit(w))return toast('Pilih dokumen yang dapat Anda sunting.');const c=[...S.admins.map(a=>({id:a.id,nama:a.nama})),...S.users.filter(u=>u.status=='approved').map(u=>({id:u.id,nama:u.nama}))].filter(x=>!w.collaborators.some(k=>k.userId==x.id));
  if(!c.length)return toast('Semua anggota sudah ada di tim.');modal('Undang kolaborator',`<div><label class="block text-xs font-semibold mb-1">Rekan guru</label><select name="u" class="${IN}">${c.map(x=>`<option value="${x.id}">${E(x.nama)}</option>`).join('')}</select></div>`+fld('r','Hak akses','text',['Editor','Viewer']),run(async d=>{await upd('workspaces',wsId,{collaborators:[...w.collaborators,{userId:d.u,nama:c.find(x=>x.id==d.u).nama,role:d.r}]});close();toast('Kolaborator ditambahkan.')}),'Undang')},
 saveName:run(async()=>{const n=$('cn').value.trim();if(!n)return;if(IS_PREVIEW)S.config={mgmpName:n};else await F.setDoc(F.doc(db,'app_config','main'),{mgmpName:n});fill();toast('Nama MGMP diperbarui.')}),
 cert:run(async(id,v)=>{await upd('users',id,{sertifikat:Math.max(0,parseInt(v)||0)})}),
 appr:run(async id=>{await upd('users',id,{status:'approved'});toast('Akun disetujui.')}),
 rej:run(async id=>{await del('users',id);toast('Akun dihapus.')}),
 install:()=>{deferred?.prompt();deferred=null},out:run(logout)};
window.A=A;window.fill=fill;boot();
</script></body></html>
